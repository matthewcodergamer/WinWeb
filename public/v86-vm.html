<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no" />
  <meta name="color-scheme" content="dark" />
  <meta name="theme-color" content="#111318" />
  <title>WinWeb PC Runtime</title>
  <style>
    :root{font-family:"Segoe UI Variable","Segoe UI",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:#f5f5f5;background:#090a0d}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0d}body{position:fixed;inset:0}
    .vm{height:100dvh;display:grid;grid-template-rows:58px minmax(0,1fr) auto;background:radial-gradient(circle at 50% 10%,#17283b 0,#0a0d11 42%,#050607 100%)}
    .bar{display:flex;align-items:center;gap:10px;padding:0 12px;border-bottom:1px solid rgba(255,255,255,.1);background:rgba(25,28,34,.95);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
    .mark{width:31px;height:31px;border-radius:9px;background:#202632;display:grid;place-items:center;overflow:hidden}.mark img{width:20px;height:20px}.title{min-width:0;flex:1}.title strong{display:block;font-size:14px}.title small{display:block;margin-top:2px;color:#aeb4bf;font-size:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .pill{height:28px;padding:0 9px;border:1px solid rgba(255,255,255,.12);border-radius:999px;background:#242830;color:#c9ced7;font-size:10px;display:flex;align-items:center;gap:6px}.pill i{width:7px;height:7px;border-radius:50%;background:#d9a300}.pill.ready i{background:#6ccb5f}.pill.error i{background:#e35d5d}
    .stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;padding:10px}
    #screen_container{max-width:100%;max-height:100%;display:grid;place-items:center;outline:none;touch-action:none}#screen_container>div{white-space:pre;font:14px/14px monospace;color:#fff;background:#000}#screen_container canvas{display:none;max-width:100%;max-height:100%;image-rendering:auto;background:#000;box-shadow:0 20px 80px rgba(0,0,0,.5)}
    .boot{position:absolute;inset:0;display:grid;place-items:center;padding:20px;background:rgba(5,7,9,.92);z-index:3}.boot.done{opacity:0;pointer-events:none;transition:opacity .28s ease}.card{width:min(430px,94%);padding:20px;border:1px solid rgba(255,255,255,.12);border-radius:18px;background:rgba(28,31,37,.96);box-shadow:0 28px 90px rgba(0,0,0,.5);display:grid;justify-items:center;gap:12px;text-align:center}.spinner{width:28px;height:28px;border:3px solid #4a515d;border-top-color:#36a3ff;border-radius:50%;animation:spin .75s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}.card strong{font-size:18px}.card small{color:#aeb4bf;font-size:12px;line-height:1.45}.progress{width:100%;height:6px;border-radius:999px;background:#333943;overflow:hidden}.progress i{display:block;height:100%;width:4%;background:#2b88d8;transition:width .2s ease}
    .log{min-height:56px;max-height:150px;border-top:1px solid rgba(255,255,255,.1);background:#191c22;padding:8px 12px calc(8px + env(safe-area-inset-bottom));font:10px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;color:#aeb4bf;overflow:auto;white-space:pre-wrap}.log b{color:#fff;font-weight:600}
    @media(max-width:430px){.vm{grid-template-rows:54px minmax(0,1fr) auto}.bar{padding:0 9px}.stage{padding:4px}.card{padding:17px}.log{max-height:116px}}
  </style>
</head>
<body>
  <main class="vm">
    <header class="bar">
      <span class="mark"><img src="./windows11-logo.svg" alt="" /></span>
      <div class="title"><strong id="vm-title">WinWeb PC</strong><small id="vm-subtitle">Native v86 x86 machine</small></div>
      <span class="pill" id="vm-pill"><i></i><span id="vm-pill-text">Waiting</span></span>
    </header>
    <section class="stage">
      <div id="screen_container" tabindex="0" aria-label="Virtual PC screen">
        <div></div>
        <canvas></canvas>
      </div>
      <div class="boot" id="vm-boot">
        <div class="card">
          <span class="spinner"></span>
          <strong id="vm-boot-title">Preparing PC</strong>
          <small id="vm-boot-copy">Waiting for the Windows disk image from WinWeb.</small>
          <div class="progress"><i id="vm-progress"></i></div>
        </div>
      </div>
    </section>
    <pre class="log" id="vm-log"><b>WinWeb v86</b> — full x86 PC fallback ready.</pre>
  </main>
  <script type="module" src="./v86-vm.mjs?v=20260906-vm1"></script>
</body>
</html>
