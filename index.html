<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f3f6fb" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#20242c" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="WinWeb" />
    <meta name="description" content="WinWeb inspects and routes compatible Windows applications to browser-native runtimes." />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./favicon-64.png" sizes="64x64" type="image/png" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" sizes="180x180" />
    <link rel="stylesheet" href="./winweb-shell.css?v=20260906-iphone2" />
    <title>WinWeb — Open Windows apps in your browser</title>
    <style>
      html,body{margin:0;min-height:100%;background:#eef2f8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      #ww-static{min-height:100vh;min-height:100svh;display:grid;place-items:center;color:#1f1f1f}
      #ww-static>div{display:grid;justify-items:center;gap:9px;text-align:center}
      #ww-static .logo{width:48px;height:48px;display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;gap:3px;padding:9px;border-radius:12px;background:linear-gradient(135deg,#0078d4,#5b5fc7)}
      #ww-static .logo i{background:white;border-radius:2px}
      #ww-static small{color:#666}
      @media(prefers-color-scheme:dark){html,body{background:#20232a}#ww-static{color:#f4f4f4}#ww-static small{color:#aaa}}
    </style>
  </head>
  <body>
    <div id="app"><div id="ww-static"><div><span class="logo"><i></i><i></i><i></i><i></i></span><strong>WinWeb</strong><small>Opening app shell…</small></div></div></div>
    <noscript>WinWeb needs JavaScript to inspect Windows executables.</noscript>
    <script defer src="./winweb-shell.js?v=20260906-iphone2"></script>
  </body>
</html>
