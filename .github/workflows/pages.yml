name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
      - name: Install WinWeb dependencies
        run: npm install
      - name: Install pinned BottleShip dependencies
        run: bun install --frozen-lockfile
        working-directory: vendor/bottleship
      - name: Build WinWeb shell
        run: npm run build
      - name: Build and verify lazy BottleShip x86 engine
        run: npm run engine:hle:bundle
      - name: Verify deployable runtime files
        run: |
          test -f dist/engines/bottleship/engine-loader.js
          test -f dist/engines/bottleship/runtime/v86.wasm
          test -f dist/engines/bottleship/runtime/bios/seabios.bin
          test -f dist/engines/bottleship/runtime/bios/vgabios.bin
          test -f dist/engines/bottleship/emulator-worker.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
