name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v2
      - uses: actions/configure-pages@v5
      - name: Install WinWeb dependencies
        run: npm install
      - name: Prepare WinWeb-owned v86 core
        run: npm run engine:v86:prepare
      - name: Install pinned BottleShip dependencies
        run: bun install --frozen-lockfile
        working-directory: vendor/bottleship
      - name: Build WinWeb shell
        run: npm run build
      - name: Build and verify BottleShip HLE + native v86 PC engine
        run: npm run engine:hle:bundle
      - name: Verify deployable runtime files
        run: |
          test -f dist/engines/bottleship/engine-loader.js
          test -f dist/engines/bottleship/runtime/v86.wasm
          test -f dist/engines/bottleship/runtime/bios/seabios.bin
          test -f dist/engines/bottleship/runtime/bios/vgabios.bin
          test -f dist/engines/bottleship/emulator-worker.js
          test -f dist/engines/v86-vm/libv86.mjs
          test -f dist/engines/v86-vm/winweb-v86.mjs
          test -f dist/engines/v86-vm/v86.wasm
          test -f dist/engines/v86-vm/bios/seabios.bin
          test -f dist/engines/v86-vm/bios/vgabios.bin
          test -f dist/engines/v86-vm/iso9660.mjs
          grep -q "createWinWebWasmLoader" dist/engines/v86-vm/winweb-v86.mjs
          grep -q "WinWeb v86 startup failed" dist/engines/bottleship/emulator-worker.js
          test "$(git -C vendor/bottleship/vendor/v86 rev-parse HEAD)" = "27c2d676ff023ab87316b6184205e3087bdc272d"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
